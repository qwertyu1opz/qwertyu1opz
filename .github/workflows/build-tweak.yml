name: build-tweak

on:
  push:
    branches: [ "claude/help-needed-xazcdt" ]
    paths:
      - "tweak/**"
      - ".github/workflows/build-tweak.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      THEOS: /home/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync perl curl zip unzip git xz-utils

      - name: Install ldid
        run: |
          sudo curl -sSL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Install Theos (official installer)
        run: |
          set -x
          export THEOS="$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o install-theos.sh
          chmod +x install-theos.sh
          yes '' | ./install-theos.sh || true
          # Fallback if the installer did not clone theos itself
          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            rm -rf "$THEOS"
            git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          echo "=== theos ==="; ls -la "$THEOS" || true
          echo "=== toolchain tree ==="; find "$THEOS/toolchain" -maxdepth 3 -name clang -o -maxdepth 3 -name '*clang*' 2>/dev/null | head || true
          echo "=== sdks as installed ==="; ls -1 "$THEOS/sdks" 2>/dev/null || true

      - name: Ensure an armv7-capable SDK (major <= 10) and drop arm64-only ones
        run: |
          set -x
          export THEOS="$THEOS"
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -sSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz
          echo "=== SDKs available in theos/sdks ==="; ls -1 sdks-master 2>/dev/null | grep -i iPhoneOS || echo "(none listed)"
          for d in sdks-master/iPhoneOS*.sdk; do
            [ -d "$d" ] || continue
            base=$(basename "$d"); ver=$(echo "$base" | sed -E 's/iPhoneOS([0-9]+).*/\1/')
            if [ "${ver:-99}" -le 10 ] 2>/dev/null; then echo "keep $base"; cp -a "$d" .; fi
          done
          rm -rf sdks-master
          # Remove any arm64-only (major > 10) SDK so 'latest' resolves to an armv7 one
          for d in iPhoneOS*.sdk; do
            [ -d "$d" ] || continue
            base=$(basename "$d"); ver=$(echo "$base" | sed -E 's/iPhoneOS([0-9]+).*/\1/')
            if [ "${ver:-0}" -gt 10 ] 2>/dev/null; then echo "drop $base"; rm -rf "$d"; fi
          done
          echo "=== final installed SDKs ==="; ls -1 | grep -i iPhoneOS || echo "(NONE - build will fail)"

      - name: Build package
        run: |
          export THEOS="$THEOS"
          cd tweak/ViberLegacyTLS
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ViberLegacyTLS-deb
          path: tweak/ViberLegacyTLS/packages/*.deb
          if-no-files-found: error

      - name: Publish .deb into repo (dist/)
        if: success()
        run: |
          set -eux
          mkdir -p dist
          cp tweak/ViberLegacyTLS/packages/*.deb dist/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.deb
          git commit -m "CI: publish built ViberLegacyTLS .deb [skip ci]" || { echo "no change"; exit 0; }
          git push origin HEAD:claude/help-needed-xazcdt
